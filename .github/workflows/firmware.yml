name: firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build esp32c6dev
        working-directory: firmware
        run: pio run -e esp32c6dev

      - name: Run native unit tests
        working-directory: firmware
        run: pio test -e native --without-uploading --without-testing-from-device || echo "no native env yet"
        continue-on-error: true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/.pio/build/esp32c6dev/firmware.bin
            firmware/.pio/build/esp32c6dev/firmware.factory.bin
            firmware/.pio/build/esp32c6dev/partitions.bin
          if-no-files-found: error
          retention-days: 14
