name: wizard

on:
  push:
    branches: [main]
    paths:
      - "windows_setup/**"
      - ".github/workflows/wizard.yml"
  pull_request:
    paths:
      - "windows_setup/**"
      - ".github/workflows/wizard.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            windows_setup/requirements.txt
            windows_setup/requirements-dev.txt

      - name: Install dependencies
        working-directory: windows_setup
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Lint
        working-directory: windows_setup
        run: |
          python -m pip install ruff
          python -m ruff check src tests
        continue-on-error: true

      - name: Run tests with coverage
        working-directory: windows_setup
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-coverage
          path: windows_setup/coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Build single-file executable
        working-directory: windows_setup
        run: |
          python -m PyInstaller --onefile --noconsole --name BusyLightSetup src\busylight_setup\main.py

      - name: Upload wizard executable
        uses: actions/upload-artifact@v4
        with:
          name: BusyLightSetup
          path: windows_setup/dist/BusyLightSetup.exe
          if-no-files-found: error
          retention-days: 14
